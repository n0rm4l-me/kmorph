replicaCount: 1

image:
  repository: ghcr.io/n0rm4l-me/kmorph
  tag: "0.3.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Leader election is required when running multiple replicas.
leaderElection:
  enabled: true

# PodMonitoring for Google Managed Prometheus (GMP).
# Requires monitoring.googleapis.com/v1 CRD (available on GKE clusters with GMP enabled).
podMonitoring:
  enabled: false
  interval: 30s

# Validating webhooks — validate ClusterProfile and ProfileActivation at admission time.
# Requires TLS certificates. Use certManager.enabled=true for automatic certificate management.
webhooks:
  enabled: false
  # Fail open (Ignore) so cluster works even if webhook is unavailable.
  # Set to Fail for strict enforcement.
  failurePolicy: Ignore
  certManager:
    enabled: false
    # Name of the cert-manager Issuer or ClusterIssuer to use.
    issuerName: kmorph-selfsigned
    issuerKind: Issuer
    duration: 8760h    # 1 year
    renewBefore: 360h  # 15 days
  # caBundle is used when certManager.enabled=false (manual TLS).
  # Base64-encoded CA certificate.
  caBundle: ""

# extraObjects allows deploying arbitrary Kubernetes objects alongside kmorph.
# Useful for deploying ClusterProfiles and ProfileActivations via the same Helm release.
# Each entry is rendered as a full manifest — use the standard kmorph API.
#
# Example:
# extraObjects:
#   - apiVersion: config.kmorph.io/v1alpha1
#     kind: ClusterProfile
#     metadata:
#       name: sleep
#     spec:
#       driftPolicy: strict
#       patches:
#       - target:
#           namespace: my-app
#           kind: Deployment
#           labelSelector:
#             tier: backend
#         patch:
#           spec:
#             replicas: 0
#   - apiVersion: config.kmorph.io/v1alpha1
#     kind: ProfileActivation
#     metadata:
#       name: fallback
#     spec:
#       profileRef: minimal
#       priority: 0
extraObjects: []
