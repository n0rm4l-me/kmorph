---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterprofiles.config.kmorph.io
spec:
  group: config.kmorph.io
  names:
    kind: ClusterProfile
    listKind: ClusterProfileList
    plural: clusterprofiles
    shortNames:
    - cp
    singular: clusterprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.driftPolicy
      name: Drift Policy
      type: string
    - jsonPath: .status.activations
      name: Activations
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterProfile defines a named set of patches to apply to cluster
          resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterProfileSpec defines the desired state of ClusterProfile.
            properties:
              driftPolicy:
                default: strict
                description: |-
                  driftPolicy defines how the controller handles manual changes when this profile is active.
                  strict: continuously re-applies patches.
                  soft: applies once, reports drift in status.
                  audit: never applies, only reports what would change.
                enum:
                - strict
                - soft
                - audit
                type: string
              patches:
                description: patches is the list of patches this profile applies when
                  activated.
                items:
                  description: ResourcePatch defines a patch to apply to a set of
                    resources.
                  properties:
                    patch:
                      description: patch is the patch to apply to the matched resources.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    patchType:
                      default: strategic
                      description: |-
                        patchType defines how the patch is applied.
                        strategic: strategic merge patch (default, works best for native k8s resources).
                        merge: JSON merge patch (use for custom CRDs like Rollout).
                      enum:
                      - strategic
                      - merge
                      type: string
                    rolloutPolicy:
                      description: |-
                        rolloutPolicy enables Rollout-aware patching for Argo Rollout targets.
                        When set, kmorph manages the full promote lifecycle instead of blindly patching.
                        Only valid when target.kind=Rollout and target.group=argoproj.io.
                      properties:
                        abortOnFailure:
                          default: true
                          description: |-
                            abortOnFailure automatically reverts the patch and restores the previous
                            stable configuration if the Rollout transitions to Degraded during promote.
                          type: boolean
                        progressDeadlineSeconds:
                          default: 600
                          description: |-
                            progressDeadlineSeconds is the maximum time in seconds to wait for the
                            Rollout to reach Healthy after patching. If exceeded, the patch is aborted.
                          type: integer
                        skipSteps:
                          default: false
                          description: |-
                            skipSteps instructs the Rollout controller to skip all canary analysis steps
                            by setting the argoproj.io/skip-steps annotation on the Rollout object itself
                            (not on the pod template). The annotation is removed once the Rollout becomes Healthy.
                          type: boolean
                      type: object
                    target:
                      description: target identifies which resources to patch.
                      properties:
                        group:
                          description: group is the API group, e.g. "apps". Empty
                            string means core group.
                          type: string
                        kind:
                          description: kind of the resource, e.g. "Deployment", "StatefulSet".
                          type: string
                        labelSelector:
                          additionalProperties:
                            type: string
                          description: labelSelector targets resources matching the
                            given labels.
                          type: object
                        name:
                          description: name targets a specific resource by name. Mutually
                            exclusive with labelSelector.
                          type: string
                        namespace:
                          description: namespace to target.
                          type: string
                      required:
                      - kind
                      - namespace
                      type: object
                  required:
                  - patch
                  - target
                  type: object
                type: array
            required:
            - patches
            type: object
          status:
            description: ClusterProfileStatus defines the observed state of ClusterProfile.
            properties:
              activations:
                description: activations lists ProfileActivations that currently reference
                  this profile.
                items:
                  type: string
                type: array
              conditions:
                description: conditions represent the current state of the ClusterProfile
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
