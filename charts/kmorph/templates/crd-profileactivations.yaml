---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: profileactivations.config.kmorph.io
spec:
  group: config.kmorph.io
  names:
    kind: ProfileActivation
    listKind: ProfileActivationList
    plural: profileactivations
    shortNames:
    - pa
    singular: profileactivation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profileRef
      name: Profile
      type: string
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.activeSince
      name: Active Since
      type: date
    - jsonPath: .status.expiresAt
      name: Expires At
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ProfileActivation activates a ClusterProfile, optionally on a schedule or for a fixed duration.
          When multiple ProfileActivations are active simultaneously, the one with the highest priority wins.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProfileActivationSpec defines the desired state of ProfileActivation.
            properties:
              duration:
                description: |-
                  duration defines how long this activation stays active after it first becomes active.
                  After the duration expires, the activation moves to Expired phase.
                  Format: Go duration string, e.g. "4h", "30m", "24h".
                  If omitted, the activation does not expire automatically.
                type: string
              priority:
                default: 0
                description: |-
                  priority determines which activation wins when multiple are active simultaneously.
                  Higher value wins. Default is 0.
                format: int32
                type: integer
              profileRef:
                description: profileRef is the name of the ClusterProfile to activate.
                type: string
              schedule:
                description: |-
                  schedule defines a recurring time window for this activation.
                  If omitted, the activation is always considered active (until expired or suspended).
                properties:
                  end:
                    description: |-
                      end is a cron expression for when this activation stops being active.
                      e.g. "0 18 * * 1-5" — weekdays at 18:00
                    type: string
                  start:
                    description: |-
                      start is a cron expression for when this activation becomes active.
                      e.g. "0 9 * * 1-5" — weekdays at 09:00
                    type: string
                  timezone:
                    default: UTC
                    description: |-
                      timezone for interpreting the cron expressions. Defaults to UTC.
                      e.g. "Asia/Tokyo"
                    type: string
                required:
                - end
                - start
                type: object
              suspended:
                default: false
                description: |-
                  suspended pauses this activation without deleting it.
                  While suspended, this activation is ignored by the controller.
                type: boolean
            required:
            - profileRef
            type: object
          status:
            description: ProfileActivationStatus defines the observed state of ProfileActivation.
            properties:
              activeProfile:
                description: activeProfile is the name of the ClusterProfile currently
                  being applied.
                type: string
              activeSince:
                description: activeSince is when this activation last became Active.
                format: date-time
                type: string
              conditions:
                description: conditions represent the current state of the ProfileActivation
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              driftDetected:
                description: driftDetected lists resources that have drifted from
                  the desired state (soft/audit modes).
                items:
                  description: DriftEntry records a single drifted resource.
                  properties:
                    detectedAt:
                      description: detectedAt is when the drift was detected.
                      format: date-time
                      type: string
                    kind:
                      description: kind of the drifted resource.
                      type: string
                    name:
                      description: name of the drifted resource.
                      type: string
                    namespace:
                      description: namespace of the drifted resource.
                      type: string
                  required:
                  - detectedAt
                  - kind
                  - name
                  - namespace
                  type: object
                type: array
              expiresAt:
                description: expiresAt is when this activation will expire (set when
                  duration is specified).
                format: date-time
                type: string
              lastAppliedTime:
                description: lastAppliedTime is when patches were last applied.
                format: date-time
                type: string
              nextTransition:
                description: nextTransition is the estimated time of the next schedule-driven
                  state change.
                format: date-time
                type: string
              phase:
                description: phase is the current lifecycle phase of this activation.
                enum:
                - Pending
                - Active
                - Expired
                - Suspended
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
