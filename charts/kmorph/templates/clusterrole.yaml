apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kmorph.fullname" . }}-manager
  labels:
    {{- include "kmorph.labels" . | nindent 4 }}
rules:
# kmorph own CRDs
- apiGroups: ["config.kmorph.io"]
  resources: ["clusterprofiles", "profileactivations"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["config.kmorph.io"]
  resources: ["clusterprofiles/status", "clusterprofiles/finalizers",
              "profileactivations/status", "profileactivations/finalizers"]
  verbs: ["get", "patch", "update"]

# Native k8s workload resources — patch targets
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["configmaps", "services", "pods"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "patch"]

# Argo Rollouts
- apiGroups: ["argoproj.io"]
  resources: ["rollouts", "rollouts/status", "analysisruns"]
  verbs: ["get", "list", "watch", "patch"]

# KEDA
- apiGroups: ["keda.sh"]
  resources: ["scaledobjects", "scaledjobs"]
  verbs: ["get", "list", "watch", "patch"]

# Leader election
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Events
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

# Webhook TLS secret — read by the manager when webhooks are enabled.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["kmorph-webhook-tls"]
  verbs: ["get", "list", "watch"]
