# sleep — все реплики выключены
apiVersion: config.kmorph.io/v1alpha1
kind: ClusterProfile
metadata:
  name: jppost-token-service-sleep
spec:
  driftPolicy: strict
  patches:
  - target:
      namespace: dev-paas-jppost-101
      kind: Rollout
      group: argoproj.io
      name: paas-token-service
    patchType: merge
    rolloutPolicy:
      skipSteps: true
      abortOnFailure: true
      progressDeadlineSeconds: 300
    patch:
      spec:
        replicas: 0

---
# minimal — 1 реплика, минимальные ресурсы
apiVersion: config.kmorph.io/v1alpha1
kind: ClusterProfile
metadata:
  name: jppost-token-service-minimal
spec:
  driftPolicy: strict
  patches:
  # patch 1: replicas via merge
  - target:
      namespace: dev-paas-jppost-101
      kind: Rollout
      group: argoproj.io
      name: paas-token-service
    patchType: merge
    rolloutPolicy:
      skipSteps: true
      abortOnFailure: true
      progressDeadlineSeconds: 300
    patch:
      spec:
        replicas: 1
  # patch 2: container resources via JSON patch (surgical, doesn't touch image)
  - target:
      namespace: dev-paas-jppost-101
      kind: Rollout
      group: argoproj.io
      name: paas-token-service
    patchType: json
    patch:
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

---
# production — 2 реплики, полные ресурсы
apiVersion: config.kmorph.io/v1alpha1
kind: ClusterProfile
metadata:
  name: jppost-token-service-production
spec:
  driftPolicy: strict
  patches:
  - target:
      namespace: dev-paas-jppost-101
      kind: Rollout
      group: argoproj.io
      name: paas-token-service
    patchType: merge
    rolloutPolicy:
      skipSteps: true
      abortOnFailure: true
      progressDeadlineSeconds: 300
    patch:
      spec:
        replicas: 2
  - target:
      namespace: dev-paas-jppost-101
      kind: Rollout
      group: argoproj.io
      name: paas-token-service
    patchType: json
    patch:
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "768Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "768Mi"
