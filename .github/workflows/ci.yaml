name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Verify generated code is up to date
      run: |
        make generate manifests
        git diff --exit-code || (echo "Generated files are out of date. Run 'make generate manifests' and commit." && exit 1)

    - name: Vet
      run: go vet ./...

    - name: Test
      run: make test
